name: CI & Release Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: macos-14 # Native Apple Silicon M1/M2 runner on GitHub Actions
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Display Swift Version
        run: swift --version

      - name: Run Test Suite
        run: swift run PrivaClipTests

  release:
    name: Build & Publish Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Application & Distributable Archive
        run: ./scripts/build_app.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/PrivaClip-macOS-arm64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
